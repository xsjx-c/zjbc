<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智鉴百草</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="container">
            <div class="logo-area">
                <a href="/" class="navbar-logo">
                    <img src="{{ url_for('static', filename='images/herbs/image.png') }}" alt="智鉴百草">
                    <span>智鉴百草</span>
                </a>
            </div>
            <div class="nav-area">
                <ul class="navbar-links">
                    <li><a href="/">首页</a></li>
                    <li><a href="/zhijianbaicao">智鉴百草</a></li>
                    <li><a href="/formula">药方智验</a></li>
                    <li><a href="/voice">AI预诊</a></li>
                    <li><a href="/knowledge_base">中药知识库</a></li>
                    <li><a href="/weight">订单汇总</a></li>
                    <li><a href="/my_clinic">我的诊室</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- 登录区域 -->
    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <h2>用户登录</h2>
                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/login">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码">
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> 记住我
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>
                    <button type="submit" class="login-btn">登录</button>
                </form>
                
                <!-- 人脸识别登录选项 -->
                <div class="login-divider">
                    <span>或</span>
                </div>
                
                <div class="face-login-section">
                    <button type="button" class="face-login-btn" id="faceLoginBtn">
                        <i class="face-icon">👤</i>
                        人脸识别登录
                    </button>
                </div>
                
                <div class="register-link">
                    <p>还没有账号？ <a href="/register">立即注册</a></p>
                </div>
                
                <!-- 人脸识别登录模态框 -->
                <div id="faceLoginModal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>人脸识别登录</h3>
                            <span class="close">&times;</span>
                        </div>
                        <div class="modal-body">
                            <div class="camera-container">
                                <video id="faceVideo" autoplay playsinline></video>
                                <canvas id="faceCanvas" style="display: none;"></canvas>
                                <div class="camera-overlay">
                                    <div class="face-detection-area"></div>
                                    <div class="camera-hint">请将面部对准摄像头</div>
                                </div>
                            </div>
                            <div class="face-login-status">
                                <p id="faceLoginStatus">正在初始化摄像头...</p>
                            </div>
                            <div class="face-login-controls">
                                <button id="captureFaceBtn" class="btn-primary">捕获人脸</button>
                                <button id="stopFaceLoginBtn" class="btn-secondary">取消</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 智鉴百草 - 视语协同的中医健康智诊智验全析平台</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
