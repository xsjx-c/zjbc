<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 智鉴百草</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="container">
            <div class="logo-area">
                <a href="/" class="navbar-logo">
                    <img src="{{ url_for('static', filename='images/herbs/image.png') }}" alt="智鉴百草">
                    <span>智鉴百草</span>
                </a>
            </div>
            <div class="nav-area">
                <ul class="navbar-links">
                    <li><a href="/">首页</a></li>
                    <li><a href="/zhijianbaicao">智鉴百草</a></li>
                    <li><a href="/formula">药方智验</a></li>
                    <li><a href="/voice">AI预诊</a></li>
                    <li><a href="/knowledge_base">中药知识库</a></li>
                    <li><a href="/weight">订单汇总</a></li>
                    <li><a href="/my_clinic">我的诊室</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- 注册区域 -->
    <section class="register-section">
        <div class="container">
            <div class="register-container">
                <h2>用户注册</h2>
                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/register">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">确认密码</label>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入密码">
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱（可选）</label>
                        <input type="email" id="email" name="email" placeholder="请输入邮箱">
                    </div>
                    <button type="submit" class="register-btn">注册</button>
                </form>
                <div class="login-link">
                    <p>已有账号？ <a href="/login">立即登录</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 智鉴百草 - 视语协同的中医健康智诊智验服务平台</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
