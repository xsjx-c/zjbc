<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智鉴百草 - 智能识别</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/zhijianbaicao.css') }}">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="container">
            <div class="logo-area">
                <a href="/" class="navbar-logo">
                    <img src="{{ url_for('static', filename='images/herbs/image.png') }}" alt="智鉴百草">
                    <span>智鉴百草</span>
                </a>
            </div>
            <div class="nav-area">
                <ul class="navbar-links">
                    <li><a href="/">首页</a></li>
                    <li><a href="/zhijianbaicao"  class="active">智鉴百草</a></li>
                    <li><a href="/formula">药方智验</a></li>
                    <li><a href="/voice">AI预诊</a></li>
                    <li><a href="/knowledge_base">中药知识库</a></li>
                    <li><a href="/weight">订单汇总</a></li>
                    <li><a href="/my_clinic">我的诊室</a></li>

                </ul>
               
            </div>
        </div>
    </header>


    <!-- 图片放大模态框 -->
    <div id="imageModal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImage">
        <div class="modal-caption" id="modalCaption"></div>
    </div>
    
    <main>
        <div class="container">
            <section class="zhijianbaicao-section">
                <h2>智鉴百草</h2>
                <p>通过摄像头实时识别或上传图片，快速鉴定中草药种类</p>
                
                <!-- 选项卡导航 -->
                <div class="tabs">
                    <button class="tab-btn active" data-tab="upload">图片上传</button>
                    <button class="tab-btn" data-tab="camera">摄像头识别</button>
                </div>

                <!-- 图片上传内容 -->
                <div class="tab-content active" id="upload-content">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📁</div>
                        <p>点击或拖拽图片到这里</p>
                        <input type="file" id="fileInput" accept="image/*" multiple>
                    </div>
                    
                    <div class="selected-images" id="selectedImages"></div>
                    
                    <button id="classifyBtn" class="btn btn-primary" disabled>开始识别</button>
                    
                    <!-- 图片上传识别结果区域 -->
                <section class="results-section" id="uploadResultsSection" style="display: none;">
                    <h3>识别结果</h3>
                    <div class="results-layout">
                        <!-- 结果列表导航栏 -->
                        <div class="results-nav">
                            <div class="nav-title">结果列表导航栏</div>
                            <div class="herb-list" id="uploadHerbList"></div>
                        </div>
                        <!-- 结果卡片容器 -->
                        <div class="results-container" id="uploadResultsContainer"></div>
                    </div>
                </section>
                </div>

                <!-- 摄像头识别内容 -->
                <div class="tab-content" id="camera-content">
                    <div class="camera-wrapper">
                        <div class="camera-controls">
                            <button id="startCamera" class="btn btn-primary">开启摄像头</button>
                            <button id="captureBtn" class="btn btn-secondary" disabled>拍照识别</button>
                            <button id="stopCamera" class="btn btn-danger" disabled>关闭摄像头</button>
                        </div>
                        <div class="camera-container">
                            <div class="camera-placeholder">摄像头区域</div> 
                            <div class="camera-preview">
                                <video id="cameraVideo" autoplay playsinline></video>
                                <canvas id="cameraCanvas" style="display: none;"></canvas>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 摄像头识别结果区域 -->
                    <section class="results-section" id="cameraResultsSection" style="display: none;">
                        <h3>识别结果</h3>
                        <div class="results-layout">
                            <!-- 结果列表导航栏 -->
                            <div class="results-nav">
                                <div class="nav-title">结果列表导航栏</div>
                                <div class="herb-list" id="cameraHerbList"></div>
                            </div>
                            <!-- 结果卡片容器 -->
                            <div class="results-container" id="cameraResultsContainer"></div>
                        </div>
                    </section>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 智鉴百草 - 视语协同的中医健康智诊智验服务平台</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/zhijianbaicao.js') }}"></script>
</body>
</html>
