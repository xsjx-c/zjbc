<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智鉴百草 - 订单汇总</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/weight.css') }}">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="container">
            <div class="logo-area">
                <a href="/" class="navbar-logo">
                    <img src="{{ url_for('static', filename='images/herbs/image.png') }}" alt="智鉴百草">
                    <span>智鉴百草</span>
                </a>
            </div>
            <div class="nav-area">
                <ul class="navbar-links">
                    <li><a href="/">首页</a></li>
                    <li><a href="/zhijianbaicao">智鉴百草</a></li>
                    <li><a href="/formula">药方智验</a></li>
                    <li><a href="/voice">AI预诊</a></li>
                    <li><a href="/knowledge_base">中药知识库</a></li>
                    <li><a href="/weight"  class="active">订单汇总</a></li>
                    <li><a href="/my_clinic">我的诊室</a></li>

                </ul>
               
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="main-content">
        <div class="container">
            <div class="title-card">
                <h2 class="section-title">订单汇总</h2>
                <p class="section-description">智能订单汇总系统，辅助管理中药材采购</p>
            </div>

            <!-- 底部：药材列表和订单汇总 -->
            <div class="bottom-panel">
                <!-- 药材列表 -->
                <div class="panel-section">
                    <h3>药材列表</h3>
                    <div class="herb-table-container">
                        <table class="herb-table">
                            <thead>
                                <tr>
                                    <th>药材名称</th>
                                    <th>重量(g)</th>
                                    <th>单价(元/g)</th>
                                    <th>小计(元)</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="herb-table-body">
                                <tr>
                                    <td colspan="4" class="empty-message">暂无药材</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 订单汇总 -->
                <div class="panel-section">
                    <h3>订单汇总</h3>
                    <div class="order-summary">
                        <div class="summary-item">
                            <label>总重量:</label>
                            <span id="total-weight">0.00 g</span>
                        </div>
                        <div class="summary-item total-amount">
                            <label>总金额:</label>
                            <span id="total-amount">¥ 0.00</span>
                        </div>
                        <div class="summary-actions">
                            <button id="clear-list-btn" class="clear-btn">清空清单</button>
                            <button id="generate-order-btn" class="order-btn">生成订单</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2025 智鉴百草 - 视语协同的中医健康智诊智验服务平台</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/weight.js') }}"></script>
</body>
</html>
